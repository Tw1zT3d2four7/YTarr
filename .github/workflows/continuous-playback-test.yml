name: Continuous playback test validation

on:
  push:
    branches:
      - continuous-playback-test
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile plugin
        run: python -m py_compile plugin.py
      - name: Validate manifest JSON
        run: python -m json.tool plugin.json > /dev/null
      - name: Smoke-test URL parsing and playlist configuration
        run: |
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("ytarr_plugin", "plugin.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert module._video_id("https://youtu.be/dQw4w9WgXcQ") == "dQw4w9WgXcQ"
          playlist = "https://music.youtube.com/playlist?list=PL5LF_xiPbHiDadP4pjl3h28-1y6oBvY7y"
          assert module._playlist_id(playlist) == "PL5LF_xiPbHiDadP4pjl3h28-1y6oBvY7y"
          configured = module._configured_playlists({"playlist_url_1": playlist})
          assert len(configured) == 1 and configured[0][2] == "PL5LF_xiPbHiDadP4pjl3h28-1y6oBvY7y"
          assert module.RADIO_PORT == 8765
          module._radio_dependencies = lambda: []
          started, message = module._ensure_radio_server()
          assert started, message
          import urllib.request
          with urllib.request.urlopen("http://127.0.0.1:8765/ytarr/health", timeout=3) as response:
              assert response.status == 200
              assert response.read() == b"YTarr radio ok"
          print("YTarr continuous-playback smoke tests passed")
          PY
