name: Build YTarr release asset

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ytarr-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build and attach YTarr ZIP to GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Validate plugin files and version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          test -f plugin.json || { echo "::error::plugin.json is missing"; exit 1; }
          test -f plugin.py || { echo "::error::plugin.py is missing"; exit 1; }

          VERSION="$(python -c 'import json; print(json.load(open("plugin.json", encoding="utf-8"))["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Packaging YTarr $VERSION"

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match plugin.json version $VERSION"
            exit 1
          fi

      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package ytarr.zip
          mkdir -p package/ytarr
          cp plugin.json plugin.py package/ytarr/
          if [[ -f README.md ]]; then
            cp README.md package/ytarr/
          fi
          (cd package && zip -qr ../ytarr.zip ytarr)
          echo "Generated release asset contents:"
          unzip -l ytarr.zip

      - name: Publish ZIP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ytarr.zip
          fail_on_unmatched_files: true
          generate_release_notes: false
